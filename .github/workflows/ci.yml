name: CI

# Vérifie chaque poussée et chaque pull request : le site compile, le backend passe ses tests.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Site — typecheck et compilation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: TypeScript (aucune erreur attendue)
        run: npm run typecheck

      - name: Compilation de production
        run: npm run build

      - name: Conserver le site compilé
        uses: actions/upload-artifact@v7
        with:
          name: site-web
          path: dist
          retention-days: 7

  backend:
    name: API et moteur — pytest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Installer FFmpeg (moteur de montage)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu fonts-liberation
          ffmpeg -hide_banner -version | head -1
          ffmpeg -hide_banner -filters | grep -q 'subtitles' && echo 'libass disponible'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Installer les dépendances Python
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip -q
          .venv/bin/python -m pip install -q -r requirements-dev.txt

      - name: Tests — 66 cas (moteur FFmpeg, API, worker, Firebase, paiement)
        working-directory: backend
        run: |
          .venv/bin/python -m pytest -q --cov=app --cov-report=term-missing:skip-covered

      - name: Journal des échecs
        if: failure()
        working-directory: backend
        run: |
          echo "Relancez en local : cd backend && .venv/bin/python -m pytest -x -vv"
